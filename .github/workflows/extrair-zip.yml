name: Extrair zip do site
on:
  push:
    branches: [main]
    paths: ['**.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Extrair o zip na raiz do repositório
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then echo "Nenhum zip na raiz"; exit 0; fi
          for z in "${zips[@]}"; do
            rm -rf /tmp/x && mkdir /tmp/x
            unzip -q -o "$z" -d /tmp/x
            rm -rf /tmp/x/__MACOSX
            src=/tmp/x
            entries=( /tmp/x/* )
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then src="${entries[0]}"; fi
            cp -a "$src"/. .
            rm -f "$z"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site Agnus Tour: arquivos extraídos do zip"
          git push -q origin HEAD:main
          git log --stat -1 | tail -5
